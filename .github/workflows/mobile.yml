name: Mobile CI

on:
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile.yml"
  push:
    branches: [ main, master ]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile.yml"

  workflow_dispatch:

defaults:
  run:
    working-directory: mobile

jobs:
  analyze_and_test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # The storage tests run against a real SQLite (sqflite_common_ffi).
      - name: Install SQLite
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libsqlite3-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.6
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze

      - name: Tests
        run: flutter test
